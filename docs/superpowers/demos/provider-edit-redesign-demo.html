<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>添加服务商 · 新布局 Demo v2</title>
<style>
  :root {
    --brand-50: #eef4ff;
    --brand-200: #c3d7fe;
    --brand-300: #a5c3fc;
    --brand-500: #5b8def;
    --brand-600: #406fe0;
    --surface: #ffffff;
    --border-muted: #ebeef2;
    --text-primary: #1f2329;
    --text-muted: #8a9099;
    --danger: #f56c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #4b5563;
    font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; gap: 24px; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
    font-size: 12px; color: var(--text-primary);
  }
  .app-window {
    width: 840px; height: 780px; min-width: 680px;
    resize: both; overflow: hidden;
    background: var(--surface);
    border-radius: 10px; box-shadow: 0 24px 64px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
  }
  .titlebar {
    height: 33px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding-left: 12px; border-bottom: 1px solid var(--border-muted);
    user-select: none;
  }
  .titlebar .t { font-size: 11px; color: var(--text-muted); }
  .win-controls { display: flex; height: 100%; }
  .win-controls button {
    width: 44px; border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .win-controls button:hover { background: #f0f1f3; }
  .win-controls svg { width: 12px; height: 12px; stroke: #666; }

  .dialog-layer { position: relative; flex: 1; min-height: 0; background: #f5f6f8; overflow: hidden; }
  .modal-wrap { position: absolute; inset: 0; display: flex; align-items: stretch; justify-content: center; padding: 14px; }
  .modal {
    width: 100%; max-width: 800px;
    background: var(--surface); border-radius: 12px;
    border: 1px solid var(--border-muted);
    box-shadow: 0 16px 48px rgba(0,0,0,.18);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border-muted);
  }
  .modal-head h3 { font-size: 13px; font-weight: 600; }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; }

  .section-label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    letter-spacing: .04em; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--border-muted); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .field input[type=text], .field input[type=password] {
    width: 100%; padding: 6px 8px; font-size: 12px;
    border: 1px solid #dfe3e8; border-radius: 6px; outline: none;
  }
  .field input:focus { border-color: var(--brand-300); box-shadow: 0 0 0 2px var(--brand-50); }
  .hint { font-size: 10px; color: #b0b6bd; margin-top: 2px; line-height: 1.5; }
  .opt-desc { font-size: 10px; color: #b0b6bd; margin-top: 4px; line-height: 1.5; }

  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .preset-btn {
    padding: 6px 4px; font-size: 11px; text-align: center; cursor: pointer;
    border: 1px solid var(--border-muted); border-radius: 6px; background: #fff; color: var(--text-muted);
  }
  .preset-btn.active { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-600); font-weight: 600; }

  /* 类型相关设置区块 */
  .ctx-box { border: 1px solid var(--border-muted); border-radius: 8px; padding: 10px; background: #fafbfc; display: flex; flex-direction: column; gap: 8px; }

  /* Google OAuth 面板 */
  .oauth-ok { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
  .oauth-ok .who { color: #34a853; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #34a853; }
  .link-btn { border: none; background: none; font-size: 10px; color: var(--brand-500); cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  /* 模型表格 */
  .model-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .toolbar-actions { display: flex; gap: 6px; }
  .btn-mini {
    padding: 4px 10px; font-size: 11px; border-radius: 6px; cursor: pointer;
    border: 1px solid #dfe3e8; background: #fff; color: var(--text-primary);
  }
  .btn-mini:hover { background: #f5f7fa; }
  .btn-mini.primary { background: var(--brand-500); border-color: var(--brand-500); color: #fff; }
  .btn-mini.primary:hover { background: var(--brand-600); }
  .count-badge { font-size: 10px; color: var(--text-muted); }

  .model-table-wrap { border: 1px solid var(--border-muted); border-radius: 8px; overflow-x: auto; }
  table.model-table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 640px; }
  .model-table th {
    text-align: left; font-weight: 500; color: var(--text-muted); font-size: 10px;
    padding: 6px 8px; background: #fafbfc; border-bottom: 1px solid var(--border-muted);
    white-space: nowrap;
  }
  .model-table th .unit { color: #c0c5cc; font-weight: 400; white-space: nowrap; }
  .model-table td { padding: 5px 8px; border-bottom: 1px solid #f3f5f7; vertical-align: middle; }
  .model-table tr:last-child td { border-bottom: none; }
  .model-name-input {
    width: 100%; padding: 4px 6px; font-size: 11px;
    border: 1px solid transparent; border-radius: 4px; outline: none;
  }
  .model-name-input:hover { border-color: #e5e8ec; }
  .model-name-input:focus { border-color: var(--brand-300); background: #fff; }
  .price-input {
    width: 100%; min-width: 58px; padding: 4px 5px; font-size: 11px; text-align: right;
    border: 1px solid #e5e8ec; border-radius: 4px; outline: none;
  }
  .price-input:focus { border-color: var(--brand-300); box-shadow: 0 0 0 2px var(--brand-50); }
  /* 货币：单元格容器与换算行 */
  .price-cell { position: relative; }
  .fx-line { font-size: 9px; color: #b8bec6; margin-top: 1px; white-space: nowrap; text-align: right; padding-right: 6px; }
  /* 货币切换段 */
  .cur-toggle { display: inline-flex; border: 1px solid #dfe3e8; border-radius: 999px; overflow: hidden; margin-right: 8px; vertical-align: middle; }
  .cur-toggle button {
    border: none; background: #fff; cursor: pointer; font-size: 10px;
    padding: 3px 10px; color: var(--text-muted);
  }
  .cur-toggle button.active { background: var(--brand-50); color: var(--brand-600); font-weight: 600; }
  .fx-meta { font-size: 10px; color: #c0c5cc; }
  .type-badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; background: #f1f3f5; color: #707781; white-space: nowrap; }
  .icon-btn { border: none; background: transparent; cursor: pointer; padding: 3px; border-radius: 4px; color: #a0a6ad; position: relative; }
  .icon-btn:hover { background: #f0f2f4; }
  .icon-btn.test-ok { color: #34a853; }
  .icon-btn.test-fail { color: var(--danger); }

  /* 测试失败 tooltip */
  .test-wrap { position: relative; display: inline-block; }
  .test-tip {
    visibility: hidden; opacity: 0; transition: opacity .12s;
    position: absolute; z-index: 30; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    width: 280px; background: #2b2f36; color: #e8eaed; border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    font-size: 10px; line-height: 1.55; text-align: left;
  }
  .test-tip::before {
    content: ""; position: absolute; top: -4px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px; background: #2b2f36;
  }
  .test-wrap:hover .test-tip, .test-wrap.open .test-tip, .type-wrap:hover .test-tip { visibility: visible; opacity: 1; }
  .test-tip b { display: block; color: #ff9c9c; margin-bottom: 3px; font-weight: 600; }
  .test-tip .err-box {
    max-height: 88px; overflow-y: auto; word-break: break-all;
    background: rgba(255,255,255,.08); border-radius: 4px; padding: 5px 6px; margin-bottom: 6px;
    font-family: Consolas, monospace; color: #d7dade;
  }
  .test-tip .copy-row { display: flex; align-items: center; gap: 6px; color: #9aa2ad; }
  .tip-copy-btn {
    border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff;
    font-size: 9px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
  }
  .tip-copy-btn:hover { background: rgba(255,255,255,.12); }

  .empty-models { text-align: center; color: var(--text-muted); font-size: 11px; padding: 24px 0; }

  .fetch-panel { border: 1px dashed var(--brand-200); border-radius: 8px; padding: 10px; margin-top: 10px; background: #fbfcff; }
  .fetch-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .fetch-head b { font-size: 11px; color: var(--brand-600); }
  .fetch-list { max-height: 120px; overflow-y: auto; border: 1px solid var(--border-muted); border-radius: 6px; background: #fff; }
  .fetch-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
  .fetch-item:hover { background: #fafbfd; }
  .fetch-foot { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }

  .modal-foot {
    flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; border-top: 1px solid var(--border-muted); background: #fcfcfd;
  }
  .foot-tip { font-size: 10px; color: var(--text-muted); }
  .foot-actions { display: flex; gap: 8px; }
  .btn { padding: 6px 16px; font-size: 12px; border-radius: 6px; border: 1px solid #dfe3e8; background: #fff; cursor: pointer; }
  .btn.primary { background: var(--brand-500); border-color: var(--brand-500); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--brand-600); }
</style>
</head>
<body>

<div class="app-window">
  <div class="titlebar">
    <span class="t">模型配置</span>
    <div class="win-controls">
      <button><svg viewBox="0 0 12 12" fill="none" stroke-width="1.2"><path d="M1 6h10"/></svg></button>
      <button><svg viewBox="0 0 12 12" fill="none" stroke-width="1.2"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg></button>
      <button><svg viewBox="0 0 12 12" fill="none" stroke-width="1.2"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
    </div>
  </div>

  <div class="dialog-layer">
    <div class="modal-wrap">
      <div class="modal">
        <div class="modal-head">
          <h3>添加服务商</h3>
          <button class="icon-btn">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg>
          </button>
        </div>

        <div class="modal-body">
          <!-- ── API 类型 ── -->
          <div class="section-label">基础配置</div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div class="field">
              <label>API 类型</label>
              <div class="presets">
                <button class="preset-btn active" data-type="openai">OpenAI</button>
                <button class="preset-btn" data-type="anthropic">Anthropic</button>
                <button class="preset-btn" data-type="google">Google</button>
                <button class="preset-btn" data-type="ollama">Ollama</button>
              </div>
            </div>

            <!-- ★ 类型相关设置：随 API 类型变化，位置固定在「服务商名称」上方，不隐藏 -->
            <div class="field ctx-box" id="ctxPanel"><!-- JS 渲染 --></div>

            <div class="row2">
              <div class="field">
                <label>服务商名称 *</label>
                <input type="text" value="My LLM 代理">
              </div>
              <!-- Google OAuth 模式下此格由登录态面板占用，见 JS -->
              <div class="field" id="credSlot"><!-- JS 渲染 API Key / 登录面板 --></div>
            </div>
            <div class="field" id="baseUrlSlot">
              <label>API Base URL *</label>
              <input type="text" value="https://api.myproxy.com/v1">
            </div>
          </div>

          <div style="height:14px;"></div>

          <!-- ── 模型管理 ── -->
          <div class="section-label">模型管理</div>
          <div class="model-toolbar">
            <span>
              <span class="cur-toggle">
                <button id="curUsd" class="active" onclick="setCurrency('USD')">$ 美元</button>
                <button id="curCny" onclick="setCurrency('CNY')">¥ 人民币</button>
              </span>
              <span class="count-badge"></span>
            </span>
            <div class="toolbar-actions">
              <span class="fx-meta" id="fxMeta">1 USD ≈ 7.21 CNY · 汇率日期 2026-08-26</span>
              <button class="btn-mini" onclick="addManual()">＋ 手动添加模型</button>
              <button class="btn-mini primary" onclick="toggleFetch()">⤓ 从服务商拉取模型列表</button>
            </div>
          </div>

          <!-- 拉取结果面板：显示在模型列表上方，默认全部不勾选 -->
          <div class="fetch-panel" id="fetchPanel" style="display:none;">
            <div class="fetch-head">
              <b>从服务商获取到 5 个模型 · 默认不勾选</b>
              <div>
                <button class="link-btn" onclick="selectAll(true)">全选</button>
                <button class="link-btn" onclick="selectAll(false)">清空</button>
              </div>
            </div>
            <div class="fetch-list" id="fetchList"></div>
            <div class="fetch-foot">
              <button class="btn-mini">追加到列表</button>
              <button class="btn-mini primary" onclick="applyFetch()">用勾选项替换现有模型</button>
            </div>
          </div>

          <div class="model-table-wrap">
            <table class="model-table">
              <thead>
                <tr>
                  <th>模型 ID</th>
                  <th style="width:80px;">类型</th>
                  <th>输入价(<span class="pu">$</span>/M)</th>
                  <th>输出价(<span class="pu">$</span>/M)</th>
                  <th>缓存读(<span class="pu">$</span>/M)</th>
                  <th>缓存写(<span class="pu">$</span>/M)</th>
                  <th style="width:40px;" title="以 OpenRouter 元数据为参考，回填该行空缺价格（已有值不覆盖）">填充</th>
                  <th style="width:56px;">测试</th>
                  <th style="width:36px;"></th>
                </tr>
              </thead>
              <tbody id="modelRows"></tbody>
            </table>
          </div>
          <div class="hint">价格留空时使用全局价目表（当前为 OpenRouter 数据）；填写后优先使用此处配置。使用哪个模型由模型方案中的角色引用决定。</div>
        </div>

        <div class="modal-foot">
          <span class="foot-tip">ESC 关闭 · 未保存的修改将丢失</span>
          <div class="foot-actions">
            <button class="btn">取消</button>
            <button class="btn primary">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ─── 类型相关设置（demo 数据，对应实现中按 providerType 条件渲染） ─── */
const CTX = {
  openai: `
    <div class="field">
      <label>API 形态</label>
      <div class="presets" style="grid-template-columns:repeat(2,1fr);">
        <button class="preset-btn sub active">Chat Completions</button>
        <button class="preset-btn sub">Responses API</button>
      </div>
      <div class="opt-desc">消息协议格式。Responses 为 OpenAI 官方推荐；<b>第三方兼容网关请保持 Chat Completions</b>。影响请求端点与报文结构。</div>
    </div>`,
  anthropic: `
    <div class="field">
      <label>system 内容块数组</label>
      <div class="presets" style="grid-template-columns:repeat(2,1fr);">
        <button class="preset-btn sub active">启用</button>
        <button class="preset-btn sub">禁用</button>
      </div>
      <div class="opt-desc">system 以内容块数组发送并附带 cache_control 提示词缓存标记。<b>经第三方网关转译时若破坏前缀缓存可关闭</b>。</div>
    </div>`,
  google: `
    <div class="field">
      <label>认证方式</label>
      <div class="presets" style="grid-template-columns:repeat(2,1fr);">
        <button class="preset-btn sub active" data-auth="key">API Key</button>
        <button class="preset-btn sub" data-auth="oauth">Google 账号登录</button>
      </div>
      <div class="opt-desc">Gemini 使用 SDK 固定端点（generativelanguage.googleapis.com），无需填写 Base URL。</div>
    </div>`,
  ollama: `
    <div class="opt-desc" style="padding-top:2px;">Ollama 为本地推理服务：<b>无需 API Key 与云端地址</b>，默认连接 http://localhost:11434，可在下方修改端口。</div>`
}

const state = { type: 'openai', auth: 'key' }

function renderCtx() {
  document.getElementById('ctxPanel').innerHTML = CTX[state.type]
  bindSub()
}
function renderCred() {
  const slot = document.getElementById('credSlot')
  const baseUrl = document.getElementById('baseUrlSlot')
  if (state.type === 'google') {
    baseUrl.style.display = 'none'
    if (state.auth === 'oauth') {
      slot.innerHTML = `
        <label>账号授权</label>
        <div class="oauth-ok">
          <span class="who"><span class="dot"></span>已授权: user@gmail.com</span>
          <button class="link-btn">切换账号</button>
        </div>
        <div class="opt-desc">通过 Google OAuth 授权 Gemini，令牌自动刷新，无需手动维护密钥。</div>`
      return
    }
    slot.innerHTML = `
      <label>API Key *</label>
      <input type="password" value="AIzaSyxxxxxxxxxxxxxxxx">
      <div class="opt-desc">在 Google AI Studio 创建的密钥。</div>`
  } else if (state.type === 'ollama') {
    baseUrl.style.display = ''
    baseUrl.querySelector('input').value = 'http://localhost:11434'
    slot.innerHTML = `<label>API Key</label><input type="text" placeholder="本地服务无需填写" disabled>`
  } else {
    baseUrl.style.display = ''
    slot.innerHTML = `
      <label>API Key *</label>
      <input type="password" value="sk-xxxxxxxxxxxxxxxx">
      <div class="opt-desc">建议同时在此网关侧为该服务商限定可用模型范围。</div>`
  }
}
function setType(t) { state.type = t; renderCtx(); renderCred() }

document.querySelectorAll('.preset-btn[data-type]').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.preset-btn[data-type]').forEach(x=>x.classList.remove('active'))
    b.classList.add('active'); setType(b.dataset.type)
  })
})
function bindSub() {
  document.querySelectorAll('.preset-btn.sub').forEach(b=>{
    b.addEventListener('click', ()=>{
      b.parentElement.querySelectorAll('.preset-btn').forEach(x=>x.classList.remove('active'))
      b.classList.add('active')
      if (b.dataset.auth) { state.auth = b.dataset.auth; renderCred() }
    })
  })
}

/* ─── 货币（对齐全局汇率管理器 exchangeRateRegistry：USD→CNY，兜底 7.2） ─── */
const FX = { rate: 7.21, date: '2026-08-26' }
let currency = 'USD'
function setCurrency(c){
  if (currency === c) return
  currency = c
  document.getElementById('curUsd').classList.toggle('active', c==='USD')
  document.getElementById('curCny').classList.toggle('active', c==='CNY')
  document.querySelectorAll('.pu').forEach(el => el.textContent = (c==='USD' ? '$' : '￥'))
  renderModels()
}
/* 内部存储统一为 USD；显示时按当前货币换算 */
const toDisp = usd => { const n = parseFloat(usd); if (isNaN(n)) return ''
  const v = currency === 'USD' ? n : n * FX.rate
  return String(+(v.toFixed(v >= 10 ? 2 : v >= 1 ? 3 : 4))) }
const fromDisp = v => { const n = parseFloat(v); if (isNaN(n)) return ''
  const usd = currency === 'USD' ? n : n / FX.rate
  return String(+usd.toFixed(8)) }
function updatePrice(i, j, val){
  const m = DEMO_MODELS[i]
  m.p[j] = fromDisp(val)
  ;(m._af || (m._af = []))[j] = false // 手动修改后不再视为自动填充值
  updateFxLine(i, j)
}
function updateFxLine(i, j){
  const cell = document.querySelector(`[data-pc="${i}-${j}"] .fx-line`)
  if (!cell) return
  const disp = document.querySelector(`[data-pc="${i}-${j}"] .price-input`).value
  const n = parseFloat(disp)
  if (isNaN(n)) { cell.textContent = ''; return }
  const sym = currency === 'USD' ? '¥' : '$'
  const other = currency === 'USD' ? n * FX.rate : n / FX.rate
  cell.textContent = `≈ ${sym}${+(other.toFixed(other >= 10 ? 2 : other >= 1 ? 3 : 4))}`
}

/* ─── 模型表（去掉启用开关） ─── */
const DEMO_MODELS = [
  { name: 'gpt-4o',          type:'multimodal', p:['2.50','10.00','1.25',''],   test:{ok:true},
    mods:['text','image'], src:'meta' },
  { name: 'gpt-4o-mini',     type:'text',       p:['','','',''],                test:null },
  { name: 'deepseek-chat',   type:'text',       p:['0.27','1.10','0.07',''],    test:{ok:true} },
  { name: 'gemini-2.5-flash',type:'multimodal', p:['0.30','2.50','0.075',''],   test:null,
    mods:['text','image','audio'], src:'name' },
  { name: 'claude-gateway',  type:'multimodal', p:['','5.00','','3.75'],        test:{ok:false, err:'400 Bad Request from gateway\n\n{"error":{"message":"Model `claude-gateway` not permitted for this API key. Allowed: gpt-*","type":"invalid_request_error","code":"model_not_allowed"}}\n\n请检查网关侧的模型白名单或更换模型名称。'} },
]
/* ─── OpenRouter 参考价填充（真实实现对接 model-meta:lookup IPC，
       主进程用 matchOpenRouterModel 模糊匹配；此处演示精确+前缀两种命中） ─── */
const OR_REGISTRY = {
  'deepseek-v3':      { p:['0.27','1.10','0.07'],        mods:['text'],            type:'text' },
  'deepseek-r1':      { p:['0.55','2.19','0.14'],        mods:['text'],            type:'text' },
  'qwen3-235b':       { p:['0.13','0.60','0.026'],       mods:['text'],            type:'text' },
  'gemini-2.5-flash': { p:['0.30','2.50','0.075'],       mods:['text','image','audio'], type:'multimodal' },
  'gemini-2.5-pro':   { p:['1.25','10.00','0.31'],       mods:['text','image','audio'], type:'multimodal' },
  'gpt-5':            { p:['1.25','10.00','0.125'],      mods:['text','image'],    type:'multimodal' },
}
const SRC_LABEL = { meta: '来源：OpenRouter 模型元数据（architecture.input_modalities）', name: '来源：模型名命名规则推断（未命中元数据）' }
const fillHints = {} // { [rowIndex]: 提示文案 }
function lookupRegistry(name){
  const key = (name || '').trim().toLowerCase()
  if (!key) return null
  if (OR_REGISTRY[key]) return OR_REGISTRY[key]
  const hitKey = Object.keys(OR_REGISTRY).find(k => k.startsWith(key) || key.includes(k))
  return hitKey ? OR_REGISTRY[hitKey] : null
}
/* 按钮触发填充：仅回填空缺价格，已有值一律不覆盖（人工校准结果优先）。
   定位：官方价与 OpenRouter 价不一致时，提供校准起点；不是实时数据源 */
function fillFromOr(i){
  const m = DEMO_MODELS[i]
  const hit = lookupRegistry(m.name)
  if (!hit) { fillHints[i] = '未匹配到 OpenRouter 元数据'; return renderModels() }
  let n = 0
  hit.p.forEach((v, j) => { if (!m.p[j]) { m.p[j] = v; n++ } })
  m.type = hit.type; m.mods = hit.mods; m.src = 'meta'
  fillHints[i] = n > 0 ? `✓ 已填充 ${n} 项空缺价格 · 来源 OpenRouter 元数据` : '无空缺价格项'
  renderModels()
}
function renderModels(){
  document.getElementById('modelRows').innerHTML = DEMO_MODELS.length === 0
    ? `<tr><td colspan="9" class="empty-models">暂无模型 · 点击上方「手动添加模型」或「从服务商拉取模型列表」开始</td></tr>`
    : DEMO_MODELS.map((m,i)=>{
    let testCell = `<button class="icon-btn" title="发起连通性测试" onclick="DEMO_MODELS[${i}].test={ok:${Math.random()>0.3}};renderModels()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8h3l1.5-3L9 11l1.5-3H14"/></svg></button>`
    if (m.test && m.test.ok) testCell = `<button class="icon-btn test-ok" title="测试通过 · 480ms">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.5"/><path d="M5.5 8l1.8 1.8L10.8 6"/></svg></button>`
    if (m.test && !m.test.ok) testCell = `<span class="test-wrap">
      <button class="icon-btn test-fail">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.5"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4"/></svg>
      </button>
      <div class="test-tip">
        <b>测试失败 · HTTP 400</b>
        <div class="err-box">${(m.test.err || '').replace(/</g,'&lt;')}</div>
        <div class="copy-row">
          <button class="tip-copy-btn" onclick="copyErr(${i},this)">复制错误信息</button>
          <span>悬停查看完整 LLM 请求返回的错误包</span>
        </div>
      </div></span>`
    return `<tr>
      <td><div>
        <input class="model-name-input" value="${m.name}" placeholder="输入模型 ID，如 gpt-4o-mini" onchange="DEMO_MODELS[${i}].name=this.value;delete fillHints[${i}];renderModels()">
        ${fillHints[i] ? `<div class="fx-line" style="${fillHints[i].startsWith('✓') ? 'color:#34a853' : 'color:#d29a9a'};">${fillHints[i]}</div>` : ''}
      </div></td>
      <td><span class="type-wrap"><span class="type-badge">${m.type}</span>${m.mods ? `<div class="test-tip" style="width:210px;"><b>输入模态</b><div style="margin-bottom:5px;">${m.mods.join(' · ')}</div><div class="copy-row" style="color:#9aa2ad;">${SRC_LABEL[m.src] || ''}</div></div>` : ''}</span></td>
      ${m.p.map((v,j)=>`<td><div class="price-cell" data-pc="${i}-${j}">
        <input class="price-input" placeholder="—" value="${toDisp(v)}" onchange="updatePrice(${i},${j},this.value)">
        <div class="fx-line"></div>
      </div></td>`).join('')}
      <td><button class="icon-btn" title="从 OpenRouter 元数据回填该行空缺价格（已有值不覆盖）" onclick="fillFromOr(${i})">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M2.5 13.5h11"/></svg>
      </button></td>
      <td>${testCell}</td>
      <td><button class="icon-btn" title="删除" onclick="DEMO_MODELS.splice(${i},1);renderModels();renderCount()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5h11M5.5 4.5V3h5v1.5m-6.5 0l.6 8h8.8l.6-8"/></svg>
      </button></td>
    </tr>`
  }).join('')
  // 渲染后填充每格的换算参考行
  DEMO_MODELS.forEach((_, i) => m4(i))
  renderCount()
}
function m4(i){ for (let j=0;j<4;j++) updateFxLine(i, j) }
function renderCount(){
  document.querySelector('.count-badge').textContent = `已配置 ${DEMO_MODELS.length} 个模型`
}
function copyErr(i, btn){
  navigator.clipboard?.writeText(DEMO_MODELS[i].test.err)
  btn.textContent = '已复制'; setTimeout(()=>btn.textContent='复制错误信息', 1200)
}

/* 手动添加模型：追加一行空白行，名称聚焦可直接输入 */
function addManual(){
  DEMO_MODELS.push({name:'', type:'未标注', p:['','','',''], test:null})
  renderModels()
  const inputs = document.querySelectorAll('#modelRows .model-name-input')
  inputs[inputs.length-1]?.focus()
}

/* 拉取列表：默认全部不勾选 */
function toggleFetch(){
  const el = document.getElementById('fetchPanel')
  if (el.style.display === 'none') {
    el.style.display = 'block'
    document.getElementById('fetchList').innerHTML = ['gpt-4o','gpt-4o-mini','gpt-4-turbo','o3-pro','chatgpt-4o-latest']
      .map(id=>`<label class="fetch-item"><input type="checkbox">${id}</label>`).join('')
  } else el.style.display = 'none'
}
function selectAll(on){ document.querySelectorAll('#fetchList input').forEach(i=>i.checked=on) }
function applyFetch(){
  const picked=[...document.querySelectorAll('#fetchList input')].filter(i=>i.checked)
    .map(i=>({name:i.closest('label').textContent.trim(),type:'未标注',p:['','','',''],test:null}))
  const head=document.querySelector('.fetch-head b')
  if(!picked.length){
    head.textContent='请先勾选要导入的模型'; head.style.color='var(--danger)'
    setTimeout(()=>{head.style.color='';head.textContent='从服务商获取到 5 个模型 · 默认不勾选'},1600)
    return
  }
  DEMO_MODELS.splice(0, DEMO_MODELS.length, ...picked)
  renderModels(); toggleFetch()
}

setType('openai')
renderModels()
</script>
</body>
