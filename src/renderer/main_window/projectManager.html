<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http: file: hclaw-media:; media-src 'self' blob: file: hclaw-media:;">
    <title>项目管理</title>
    <script>
        // 在浏览器首次绘制前同步读取主题，防止日/夜间主题闪烁（与 dialogWindow/index.html 同款，精简版）
        (function () {
            try {
                var theme = window.electronAPI?.initialTheme || localStorage.getItem('hclaw-theme');
                var THEMES = {
                    'dark': {class: 'dark', vars: {'--surface': '#1e1e1e', '--surface-muted': '#252526', '--surface-elevated': '#2d2d2d', '--surface-overlay': '#333333', '--surface-chrome': '#1a1a1a', '--text-primary': '#d4d4d4', '--text-secondary': '#9e9e9e', '--text-muted': '#8a8a8a', '--border': 'rgba(255,255,255,0.06)', '--border-muted': 'rgba(255,255,255,0.03)', '--border-emphasis': 'rgba(255,255,255,0.10)', '--chip-bg': 'rgba(255,255,255,0.05)', '--chip-border': 'rgba(255,255,255,0.07)', '--track': 'rgba(255,255,255,0.15)', '--track-strong': 'var(--text-muted)', '--brand-primary': '#2dd4a8', '--brand-muted': 'rgba(26, 192, 148, 0.18)', '--success': '#10b981', '--warning': '#d4a021', '--error': '#c45c5c', '--info': '#5b8dd9'}},
                    'yuanshandai': {class: 'yuanshandai', vars: {'--surface': '#31475d', '--surface-muted': '#3a546f', '--surface-elevated': '#384d64', '--surface-overlay': '#273c52', '--surface-chrome': '#2b3f54', '--text-primary': '#e8edf2', '--text-secondary': '#bdc8d3', '--text-muted': '#9dabbc', '--border': 'rgba(255,255,255,0.083)', '--border-muted': 'rgba(255,255,255,0.039)', '--border-emphasis': 'rgba(255,255,255,0.187)', '--chip-bg': 'rgba(255,255,255,0.05)', '--chip-border': 'rgba(255,255,255,0.10)', '--track': 'rgba(255,255,255,0.15)', '--track-strong': 'var(--text-muted)', '--brand-primary': '#5ba8a8', '--brand-muted': 'rgba(75, 160, 160, 0.18)', '--brand-ink': '#2f6b6b', '--brand-ink-hover': '#245757', '--success': '#45a88c', '--warning': '#c9953a', '--error': '#c45c5c', '--info': '#6a9fd8'}},
                    'shiyangjin': {class: 'shiyangjin', vars: {'--surface': '#FFF8F7', '--surface-muted': '#ffe9e5', '--surface-elevated': '#FFFFFF', '--surface-overlay': '#ffe0dc', '--surface-chrome': '#FCEEEC', '--text-primary': '#3C2E2D', '--text-secondary': '#736664', '--text-muted': '#7a6763', '--border': '#e0ccca', '--border-muted': '#f3e1dd', '--border-emphasis': '#c5a5a1', '--chip-bg': '#FFF8F7', '--chip-border': '#deccca', '--track': '#dcc9c7', '--track-strong': '#bd9b96', '--brand-primary': '#D6756B', '--brand-muted': 'rgba(214, 117, 107, 0.15)', '--brand-ink': '#A8463B', '--brand-ink-hover': '#8f3a30', '--success': '#10b981', '--warning': '#f59e0b', '--error': '#ef4444', '--info': '#3b82f6'}}
                };
                var rootStyle = document.documentElement.style;
                if (theme && THEMES[theme]) {
                    document.documentElement.classList.add(THEMES[theme].class);
                    for (var key in THEMES[theme].vars) rootStyle.setProperty(key, THEMES[theme].vars[key]);
                }
                if (window.electronAPI?.isWin11) document.documentElement.classList.add('win11');
                if (window.electronAPI?.isDarwin) document.documentElement.classList.add('darwin');
            } catch (e) {}
        })();
    </script>
</head>
<body style="margin:0;overflow:hidden;background:var(--surface,#ffffff);">
<div id="project-manager-root"></div>
<script type="module" src="../project-manager/main.tsx"></script>
</body>
</html>
